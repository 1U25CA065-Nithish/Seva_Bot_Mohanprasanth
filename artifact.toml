kind = "web"
previewPath = "/"
title = "Seva bot"
description = "Seva bot is a unified industrial approvals and compliance management platform for entrepreneurs, startups, and government departments."
version = "1.0.0"
id = "artifacts/cleargov"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20490

[services.development]
run = "pnpm --filter @workspace/cleargov run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cleargov", "run", "build" ]
serve = "static"
publicDir = "artifacts/cleargov/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20490"
BASE_PATH = "/"
